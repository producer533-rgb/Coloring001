<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Coloring Game</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8fbff, #e9f3ff);
      color: #222;
      text-align: center;
    }

    header {
      padding: 18px 12px 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
    }

    p {
      margin: 6px 0 14px;
      font-size: 1rem;
    }

    .game {
      max-width: 900px;
      margin: auto;
      padding: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
    }

    .swatch {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 8px #0002;
      cursor: pointer;
    }

    .swatch.selected {
      outline: 4px solid #222;
      transform: scale(1.08);
    }

    button, select, input[type="range"] {
      font-size: 1rem;
    }

    button, select {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: white;
      box-shadow: 0 2px 8px #0002;
      cursor: pointer;
    }

    label {
      background: white;
      border-radius: 999px;
      padding: 8px 12px;
      box-shadow: 0 2px 8px #0002;
    }

    .canvas-wrap {
      position: relative;
      width: min(92vw, 780px);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 30px #0002;
      overflow: hidden;
      touch-action: none;
    }

    canvas, svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      z-index: 1;
      cursor: crosshair;
    }

    svg {
      z-index: 2;
      pointer-events: none;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>Color the Friendly Dino</h1>
    <p>Pick a color, then drag your finger or mouse to color!</p>
  </header>

  <main class="game">
    <div class="toolbar">
      <div id="palette"></div>

      <label>
        Brush
        <input id="brushSize" type="range" min="6" max="42" value="18" />
      </label>

      <button id="eraserBtn">Eraser</button>
      <button id="clearBtn">Clear</button>
      <button id="saveBtn">Save Picture</button>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="colorCanvas"></canvas>

      <svg viewBox="0 0 800 600" aria-label="Friendly dinosaur outline">
        <g fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <!-- ground -->
          <path d="M70 510 C210 485, 600 485, 730 510" />

          <!-- sun -->
          <circle cx="675" cy="95" r="45" />
          <path d="M675 25 V5 M675 185 V165 M605 95 H585 M765 95 H745 M625 45 L610 30 M725 145 L740 160 M625 145 L610 160 M725 45 L740 30" />

          <!-- dino body -->
          <path d="M210 405 C160 330, 190 245, 285 225 C345 130, 455 125, 505 210 C585 220, 640 275, 625 350 C610 425, 525 455, 430 438 C350 485, 255 470, 210 405 Z" />

          <!-- head snout -->
          <path d="M470 198 C545 160, 635 178, 660 240 C675 275, 650 310, 605 308 C560 306, 520 275, 495 235" />

          <!-- eye and smile -->
          <circle cx="555" cy="220" r="8" fill="#111" />
          <path d="M575 265 C598 285, 625 280, 640 258" />

          <!-- legs -->
          <path d="M295 435 L270 505 L335 505 L355 450" />
          <path d="M470 438 L490 505 L555 505 L525 425" />

          <!-- arm -->
          <path d="M420 310 C382 322, 370 355, 398 370" />

          <!-- tail -->
          <path d="M215 365 C145 355, 95 315, 75 250 C145 270, 195 295, 235 330" />

          <!-- back plates -->
          <path d="M310 224 L330 175 L355 222" />
          <path d="M375 190 L405 135 L430 200" />
          <path d="M455 195 L490 145 L510 215" />

          <!-- clouds -->
          <path d="M95 125 C90 95, 130 80, 150 105 C170 75, 220 90, 215 130 C245 130, 260 165, 230 180 H105 C75 175, 70 140, 95 125 Z" />
        </g>
      </svg>
    </div>

    <div class="hint">Tip: The black lines stay on top, so kids can color freely inside or outside the shapes.</div>
  </main>

  <script>
    const canvas = document.getElementById("colorCanvas");
    const wrap = document.getElementById("canvasWrap");
    const ctx = canvas.getContext("2d");
    const brushSize = document.getElementById("brushSize");
    const eraserBtn = document.getElementById("eraserBtn");
    const clearBtn = document.getElementById("clearBtn");
    const saveBtn = document.getElementById("saveBtn");
    const palette = document.getElementById("palette");

    const colors = [
      "#ff4d6d", "#ffb703", "#80ed99", "#38bdf8",
      "#7c3aed", "#fb8500", "#8ecae6", "#b08968",
      "#ffffff", "#222222"
    ];

    let currentColor = colors[0];
    let drawing = false;
    let lastPoint = null;
    let erasing = false;

    function resizeCanvas() {
      const rect = wrap.getBoundingClientRect();
      const snapshot = document.createElement("canvas");
      snapshot.width = canvas.width;
      snapshot.height = canvas.height;
      snapshot.getContext("2d").drawImage(canvas, 0, 0);

      canvas.width = Math.round(rect.width * devicePixelRatio);
      canvas.height = Math.round(rect.height * devicePixelRatio);
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (snapshot.width && snapshot.height) {
        ctx.drawImage(snapshot, 0, 0, rect.width, rect.height);
      }
    }

    function makePalette() {
      colors.forEach((color, index) => {
        const btn = document.createElement("button");
        btn.className = "swatch" + (index === 0 ? " selected" : "");
        btn.style.background = color;
        btn.title = color;
        btn.addEventListener("click", () => {
          currentColor = color;
          erasing = false;
          document.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
          btn.classList.add("selected");
          eraserBtn.textContent = "Eraser";
        });
        palette.appendChild(btn);
      });
    }

    function getPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const touch = event.touches ? event.touches[0] : event;
      return {
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top
      };
    }

    function drawTo(point) {
      const size = Number(brushSize.value);
      ctx.globalCompositeOperation = erasing ? "destination-out" : "source-over";
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = size;

      ctx.beginPath();
      ctx.moveTo(lastPoint.x, lastPoint.y);
      ctx.lineTo(point.x, point.y);
      ctx.stroke();

      lastPoint = point;
    }

    function startDrawing(event) {
      event.preventDefault();
      drawing = true;
      lastPoint = getPoint(event);
      drawTo(lastPoint);
    }

    function keepDrawing(event) {
      if (!drawing) return;
      event.preventDefault();
      drawTo(getPoint(event));
    }

    function stopDrawing() {
      drawing = false;
      lastPoint = null;
      ctx.globalCompositeOperation = "source-over";
    }

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", keepDrawing);
    window.addEventListener("mouseup", stopDrawing);

    canvas.addEventListener("touchstart", startDrawing, { passive: false });
    canvas.addEventListener("touchmove", keepDrawing, { passive: false });
    window.addEventListener("touchend", stopDrawing);

    eraserBtn.addEventListener("click", () => {
      erasing = !erasing;
      eraserBtn.textContent = erasing ? "Color Again" : "Eraser";
      document.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
    });

    clearBtn.addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    saveBtn.addEventListener("click", () => {
      const output = document.createElement("canvas");
      const rect = wrap.getBoundingClientRect();
      output.width = canvas.width;
      output.height = canvas.height;
      const out = output.getContext("2d");

      out.fillStyle = "white";
      out.fillRect(0, 0, output.width, output.height);
      out.drawImage(canvas, 0, 0);

      const svg = document.querySelector("svg");
      const svgData = new XMLSerializer().serializeToString(svg);
      const img = new Image();
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = () => {
        out.drawImage(img, 0, 0, output.width, output.height);
        URL.revokeObjectURL(url);
        const link = document.createElement("a");
        link.download = "my-coloring-picture.png";
        link.href = output.toDataURL("image/png");
        link.click();
      };

      img.src = url;
    });

    makePalette();
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
  </script>
</body>
</html>
